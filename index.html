<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCM 身体地图 Beta</title><style>
:root{--bg:#f3efe6;--paper:#fffdf8;--ink:#273028;--muted:#73766f;--line:#ddd6ca;--green:#425b45;--soft:#edf1e9;--warm:#f7efe0;--red:#8a5d56}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:780px;margin:auto;min-height:100vh;padding:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:28px;margin:18px 0;box-shadow:0 10px 30px rgba(45,42,30,.05)}h1{font-size:36px;line-height:1.15;margin:12px 0}h2{font-size:25px;margin:8px 0 12px}h3{font-size:17px;margin:18px 0 8px}.muted{color:var(--muted);line-height:1.75}.pill{display:inline-block;background:#e8eadf;border-radius:999px;padding:6px 10px;margin:3px;font-size:12px}.warn{font-size:13px;line-height:1.65;background:var(--warm);border-radius:13px;padding:13px}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.progress{height:7px;background:#e4ded2;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--green);transition:.25s}.question{font-size:25px;font-weight:750;line-height:1.5;margin:16px 0 22px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;text-align:left;font-size:16px;cursor:pointer}.option.sel{background:var(--green);border-color:var(--green);color:#fff}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#e7e3da}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{border:1px solid #e5ded2;background:#faf8f2;border-radius:16px;padding:15px}.bar{height:8px;background:#e9e4d9;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#71816d}.callout{background:var(--soft);border-left:4px solid var(--green);padding:14px;border-radius:12px;line-height:1.7;margin:10px 0}.evidence{border-top:1px solid #e7e0d4;margin-top:13px;padding-top:13px}.tag{font-size:12px;border:1px solid #cfc8bb;border-radius:999px;padding:4px 8px;margin-right:5px}.restart{width:100%;margin-top:14px}.red{color:var(--red)}@media(max-width:620px){.shell{padding:12px}.card{padding:22px 18px}h1{font-size:31px}.question{font-size:22px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell">
<div id="intro" class="card"><span class="pill">Evidence-bound Beta</span><span class="pill">30 核心题</span><span class="pill">动态追问</span><h1>看懂你的身体底色，和最近发生了什么。</h1><p class="muted">先看长期底色，再看最近两周的变化和身体位置。系统只在证据足够时展示经典辨证路径；证据不足时会明确告诉你“不足”。</p><div class="warn">健康教育工具，不是医学诊断或处方。当前“身体底色”是观察层，不冒充 GB/T 46939—2025 的正式九体质判定；国标正式题项与算法完成逐条核验前保持锁定。</div><button class="btn primary restart" onclick="start()">开始 · 约 4–6 分钟</button></div>
<div id="quiz" class="hidden"><div class="top"><span id="count"></span><span id="phase"></span></div><div class="progress"><div id="prog"></div></div><div class="card"><div id="qtext" class="question"></div><div id="helper" class="muted"></div><div id="opts" class="options"></div><div class="actions"><button class="btn secondary" id="back" onclick="prev()">上一题</button><button class="btn primary" id="next" onclick="next()">下一题</button></div></div></div>
<div id="result" class="hidden"></div></div><script>
const CORE=[
['B01','平时你容易觉得累吗？','baseline','easy_fatigue'],['B02','平时你比身边的人更怕冷吗？','baseline','cold_tendency'],['B03','平时你比身边的人更怕热吗？','baseline','heat_tendency'],['B04','平时你的身体容易觉得干吗？','baseline','dryness_tendency'],['B05','平时你容易出汗吗？','baseline','easy_sweating'],['B06','平时你的身体容易觉得沉重吗？','baseline','body_heavy_baseline'],['B07','平时你的食欲好吗？','baseline','appetite_baseline'],['B08','平时你的大便容易偏稀吗？','baseline','loose_stool_baseline'],['B09','平时你的睡眠容易被打断吗？','baseline','sleep_interruption_baseline'],['B10','情绪变化时，你的身体症状会明显跟着变化吗？','baseline','emotion_body_link'],
['C01','最近两周，你觉得口渴吗？','current','thirst_recent'],['C02','最近两周，你的食欲下降了吗？','current','appetite_recent'],['C03','最近两周，你容易恶心吗？','current','nausea_recent'],['C04','最近两周，你有腹胀吗？','current','bloating_recent'],['C05','最近两周，你的大便偏干或难排吗？','current','constipation_recent'],['C06','最近两周，你的小便明显比平时少吗？','current','urine_low'],['C07','最近两周，你在不热、没运动时也会出汗吗？','current','rest_sweating_recent'],['C08','最近两周，你有明显的烦热感吗？','current','heat_recent'],['C09','最近两周，你有怕冷或发冷的感觉吗？','current','cold_recent'],['C10','最近两周，你睡不着或很难入睡吗？','current','sleep_onset_recent'],
['L01','最近你有头痛吗？','location','headache'],['L02','最近你的咽喉不舒服吗？','location','throat_discomfort'],['L03','最近你有胸闷吗？','location','chest_tightness'],['L04','最近你的两侧肋骨附近或胁部不舒服吗？','location','flank_discomfort'],['L05','最近你的胃脘部不舒服吗？','location','epigastric_discomfort'],['L06','最近你有腹痛吗？','location','abdominal_pain'],['L07','最近你的腰部经常酸痛或不舒服吗？','location','waist_discomfort'],['L08','最近你的四肢有肿胀吗？','location','limb_swelling'],['L09','最近你的关节有疼痛吗？','location','joint_pain'],['L10','最近你的身体某处有固定位置的疼痛吗？','location','fixed_pain']];
const ADAPT=[
{code:'alt',q:'最近有没有一阵冷、一阵热，反复交替的感觉？',when:x=>on(x,'chest_tightness')||on(x,'flank_discomfort'),key:'alternating',src:'《伤寒论》小柴胡汤条'},
{code:'dizzy',q:'胸部不舒服时，会不会同时觉得头晕？',when:x=>on(x,'chest_tightness'),key:'dizziness',src:'《金匮要略》苓桂术甘汤条'},
{code:'thirstdrink',q:'虽然口渴，你会不会其实不太想喝很多水？',when:x=>on(x,'thirst_recent'),key:'thirst_not_drink',src:'《湿热病篇》第一条'},
{code:'urine',q:'口渴的时候，小便是不是也明显减少或不顺？',when:x=>on(x,'thirst_recent'),key:'urination_difficult',src:'《伤寒论》五苓散条'},
{code:'afternoon',q:'热感是不是下午到傍晚更明显？',when:x=>on(x,'heat_recent'),key:'afternoon_heat',src:'《温病条辨》中焦篇'},
{code:'night',q:'是不是晚上明显发热，早晨会凉下来？',when:x=>on(x,'heat_recent'),key:'night_heat_morning_cool',src:'《温病条辨》青蒿鳖甲汤条'},
{code:'days',q:'最近会连续几天都没有大便吗？',when:x=>on(x,'constipation_recent'),key:'days_no_stool',src:'《温病条辨》增液汤条'},
{code:'jointstool',q:'关节痛的时候，大便会不会反而比较稀？',when:x=>on(x,'joint_pain'),key:'joint_loose_stool',src:'《金匮要略》湿痹条'},
{code:'windsweat',q:'出汗的时候，你会不会特别怕风？',when:x=>on(x,'rest_sweating_recent')||on(x,'easy_sweating'),key:'sweat_aversion_wind',src:'《金匮要略》风湿条'}];
const OPT=['没有','有一点','比较明显','很明显']; let items=[...CORE],answers={},idx=0,adaptiveBuilt=false;
function on(x,k){return (x[k]||0)>=2} function start(){intro.classList.add('hidden');quiz.classList.remove('hidden');render()}
function phaseName(it){return it[2]==='baseline'?'第一部分 · 身体底色':it[2]==='current'?'第二部分 · 最近状态':it[2]==='location'?'第三部分 · 身体位置':'动态追问 · 经典鉴别'}
function render(){let it=items[idx];count.textContent=`${idx+1} / ${items.length}`;phase.textContent=phaseName(it);prog.style.width=(idx/items.length*100)+'%';qtext.textContent=it[1];helper.textContent=it[2]==='baseline'?'请按过去约 3 个月的通常情况回答。':it[2]==='current'?'请按最近约 2 周回答。':it[2]==='adaptive'?'这道题由你前面的回答触发，用来区分相近路径。':'';opts.innerHTML=OPT.map((o,j)=>`<button class="option ${answers[it[3]]===j?'sel':''}" onclick="choose(${j})">${o}</button>`).join('');back.disabled=idx===0;next.textContent=(idx===items.length-1&&adaptiveBuilt)?'生成身体地图':'下一题'}
function choose(j){answers[items[idx][3]]=j;render()} function prev(){if(idx>0){idx--;render()}}
function next(){if(answers[items[idx][3]]==null){alert('请先选择一个答案');return}if(idx===29&&!adaptiveBuilt){let chosen=ADAPT.filter(r=>r.when(answers)).slice(0,3);items=CORE.concat(chosen.map(r=>[r.code,r.q,'adaptive',r.key,r.src]));adaptiveBuilt=true;if(chosen.length===0){showResult();return}}if(idx<items.length-1){idx++;render()}else showResult()}
function axis(){let A=answers;return {寒:((A.cold_tendency||0)+(A.cold_recent||0))*16,热:((A.heat_tendency||0)+(A.heat_recent||0))*16,燥:((A.dryness_tendency||0)+(A.thirst_recent||0))*16,湿:((A.body_heavy_baseline||0)+(A.bloating_recent||0)+(A.limb_swelling||0))*11,虚:((A.easy_fatigue||0)+(A.easy_sweating||0)+(A.appetite_recent||0))*11,气机:((A.emotion_body_link||0)+(A.chest_tightness||0)+(A.flank_discomfort||0))*11}}
function locations(){let A=answers;return {上焦:Math.min(100,((A.throat_discomfort||0)+(A.chest_tightness||0)+(A.headache||0))*11),中焦:Math.min(100,((A.appetite_recent||0)+(A.bloating_recent||0)+(A.epigastric_discomfort||0)+(A.abdominal_pain||0))*9),下焦:Math.min(100,((A.waist_discomfort||0)+(A.limb_swelling||0)+(A.urine_low||0))*11)}}
const PATHS=[
{name:'少阳相关方证',src:'《伤寒论》小柴胡汤条',support:[['alternating','往来寒热',2],['flank_discomfort','胸胁不适',1],['appetite_recent','食欲下降',1],['nausea_recent','恶心/呕意',1]],contra:[['alternating','明确没有往来寒热',1.6]]},
{name:'湿温路径',src:'《温病条辨》四三 / 《湿热病篇》',support:[['body_heavy_baseline','身重',1],['chest_tightness','胸闷',1],['appetite_recent','不饥/食欲下降',1],['afternoon_heat','午后热',1.5],['thirst_not_drink','渴而不欲多饮',1.5]],contra:[]},
{name:'痰饮相关路径',src:'《金匮要略》苓桂术甘汤条',support:[['chest_tightness','胸胁支满样不适',1],['dizziness','目眩/头晕',2]],contra:[]},
{name:'五苓散原典路径',src:'《伤寒论》五苓散条',support:[['thirst_recent','口渴',1],['urine_low','小便减少',1],['urination_difficult','小便少或不顺',2]],contra:[['urination_difficult','小便并不减少或不顺',1.6]]},
{name:'阳明温病路径',src:'《温病条辨》中焦篇',support:[['constipation_recent','便秘',1],['heat_recent','热感',1],['afternoon_heat','日晡益甚',2]],contra:[['cold_recent','近期明显怕冷',1]]},
{name:'津亏 / 增液汤相关路径',src:'《温病条辨》增液汤条',support:[['constipation_recent','便秘',1],['dryness_tendency','偏干',1],['days_no_stool','数日不大便',2]],contra:[]},
{name:'青蒿鳖甲汤相关路径',src:'《温病条辨》下焦篇',support:[['heat_recent','热感',.5],['night_heat_morning_cool','夜热早凉',2]],contra:[['night_heat_morning_cool','明确无夜热早凉',1.8]]},
{name:'湿痹路径',src:'《金匮要略》湿痹条',support:[['joint_pain','关节疼痛',1],['urine_low','小便不利相关表现',1],['joint_loose_stool','大便反快',2]],contra:[['joint_loose_stool','关节痛时大便并不偏稀',1.7]]},
{name:'皮水 / 水气相关路径',src:'《金匮要略》防己茯苓汤条',support:[['limb_swelling','四肢肿',2],['urine_low','水液排出异常线索',.5]],contra:[]}];
function scoredPaths(){return PATHS.map(p=>{let sup=[],con=[],s=0;for(let [k,t,w] of p.support){if(on(answers,k)){s+=w;sup.push(t)}}for(let [k,t,w] of p.contra){if(answers[k]===0){s-=w;con.push(t)}}return {...p,score:s,sup,con}}).filter(p=>p.score>0).sort((a,b)=>b.score-a.score).slice(0,3)}
function level(p){if(p.sup.length>=3&&p.score>=4&&!p.con.length)return '证据较集中';if(p.sup.length>=2&&p.score>=2)return '经典候选';return '方向提示'}
function bar(k,v){return `<div class="mini"><b>${k}</b><div class="bar"><div class="fill" style="width:${Math.min(100,v)}%"></div></div></div>`}
function showResult(){quiz.classList.add('hidden');result.classList.remove('hidden');let ax=axis(),loc=locations(),ps=scoredPaths();let base=[];if(ax.寒>35)base.push('偏寒');if(ax.热>35)base.push('偏热');if(ax.燥>35)base.push('偏燥');if(ax.湿>35)base.push('偏湿');if(ax.虚>35)base.push('偏虚');if(!base.length)base=['整体较平稳'];let html=`<div class="card"><span class="pill">你的 TCM Body Map</span><h1>${base.join(' · ')}</h1><p class="muted">这是“身体底色观察”，不是 GB/T 46939—2025 九体质正式判定。长期底色和最近两周状态会分开理解。</p><h3>① 身体底色 × 当前状态</h3><div class="grid">${Object.entries(ax).map(x=>bar(...x)).join('')}</div><h3>② 身体地图</h3><div class="grid">${Object.entries(loc).map(x=>bar(...x)).join('')}</div><div class="callout">上焦主要汇总头面、咽喉与胸部线索；中焦汇总食欲、胃脘、腹胀腹痛；下焦汇总腰部、小便与肢体水液线索。它是传统框架下的观察地图，不等同于器官疾病定位。</div><h3>③ 经典辨证路径</h3>`;
if(!ps.length) html+=`<div class="callout"><b>证据不足 / 整体较平稳</b><br>目前没有足够的独立证据把你推向某一条经典路径，因此不强行给方证标签。</div>`;else ps.forEach((p,n)=>{html+=`<div class="mini evidence"><span class="tag">Top ${n+1}</span><span class="tag">${level(p)}</span><h2>${p.name}</h2><p><b>支持：</b>${p.sup.join('、')||'暂无'}</p><p class="red"><b>反证：</b>${p.con.join('、')||'目前未见明确反证'}</p><p class="muted"><b>来源：</b>${p.src}</p><p class="muted">这表示你的回答与该经典条文路径有相似处，不表示你被诊断为该证，也不等于应该使用对应方剂。</p></div>`});
html+=`<h3>④ 下一步怎么看</h3><div class="callout">结果优先告诉你：哪些表现聚在一起、主要落在哪个传统位置、哪些经典路径值得进一步了解，以及什么证据会反对这条路径。方剂只作为经典知识解释，不提供个人剂量或自动处方。</div><h3>⑤ 关于九种体质</h3><p class="muted">现行 GB/T 46939—2025 已确认九种基本体质并采用典型体感问题与等级计分算法。当前 Beta 尚未把未经逐项核验的正式题项与阈值混入结果，因此不会声称“按国标你是某某质”。</p><div class="warn">如果症状持续、明显加重，或涉及胸痛、呼吸困难、异常出血、持续高热等情况，应优先接受正规医疗评估。中药存在相互作用、孕期禁忌及个体差异，不要仅凭本测试自行用药。</div><button class="btn primary restart" onclick="location.reload()">重新测试</button></div>`;result.innerHTML=html;window.scrollTo(0,0)}
</script></body></html>
