<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TCM 身体状态辨证 V3</title>
<style>
:root{--bg:#f4f0e7;--paper:#fffdf8;--ink:#263027;--muted:#6f746c;--line:#ddd5c8;--green:#425b45;--green2:#71816d;--soft:#eef1ea;--warm:#f6efe1}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.shell{max-width:760px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:13px}.progress{height:7px;background:#e4ded2;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--green);transition:.3s;width:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;margin:18px 0;box-shadow:0 10px 28px rgba(40,40,30,.05)}h1{font-size:36px;line-height:1.12;margin:10px 0 12px}h2{font-size:25px;margin:8px 0 12px}h3{font-size:17px;margin:18px 0 8px}.muted{color:var(--muted);line-height:1.72}.pill{display:inline-block;background:#e8eadf;border-radius:999px;padding:6px 10px;margin:3px;font-size:12px}.question{font-size:25px;font-weight:750;line-height:1.45;margin:16px 0 22px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px 16px;text-align:left;font-size:16px;cursor:pointer;transition:.15s}.option:hover{border-color:#9da899}.option.sel{background:var(--green);border-color:var(--green);color:#fff}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#e7e3da;color:var(--ink)}.secondary:disabled{opacity:.45}.hidden{display:none}.warn{font-size:13px;line-height:1.65;background:var(--warm);color:#6b5b46;border-radius:13px;padding:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{border:1px solid #e6dfd3;background:#faf8f2;border-radius:15px;padding:15px}.bar{height:9px;background:#e9e4d9;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--green2)}.callout{background:var(--soft);border-left:4px solid var(--green);padding:14px;border-radius:12px;line-height:1.7;margin:10px 0}.score{font-size:24px;font-weight:800}.section{border-top:1px solid #e7e0d4;margin-top:16px;padding-top:16px}.restart{margin-top:14px;width:100%}@media(max-width:620px){.shell{padding:12px}.card{padding:22px 18px}h1{font-size:31px}.question{font-size:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<div id="intro" class="card">
<span class="pill">TCM V3</span><span class="pill">48 题</span><span class="pill">一题一页</span>
<h1>为什么我的身体会这样？</h1>
<p class="muted">这不是把你塞进一个“体质标签”，而是同时看：气虚、血虚、阴虚、阳虚；寒与热；湿、痰、湿热、气滞、血瘀；以及脾胃/中焦、肝、肾、肺、心和三焦位置。</p>
<div class="warn">这是传统中医理论的健康教育与自我观察工具，不是诊断或处方。方剂部分只解释传统辨证思路，不建议仅凭测试自行服药、加减或确定剂量。</div>
<button class="btn primary restart" onclick="startQuiz()">开始辨证</button>
</div>
<div id="quiz" class="hidden">
<div class="top"><span id="count"></span><span id="phase"></span></div>
<div class="progress"><div id="prog"></div></div>
<div class="card">
<div id="qtext" class="question"></div>
<div id="opts" class="options"></div>
<div class="actions"><button id="back" class="btn secondary" onclick="prev()">上一题</button><button id="next" class="btn primary" onclick="next()">下一题</button></div>
</div>
</div>
<div id="result" class="hidden"></div>
</div>
<script>
const L=['从不','偶尔','有时','经常','几乎总是'];
const N={qi:'气虚',blooddef:'血虚',yin:'阴虚',yang:'阳虚',cold:'寒象',heat:'热象',damp:'湿',phlegm:'痰',dampheat:'湿热',stagnation:'气滞',stasis:'血瘀',spleen:'脾胃/中焦',kidney:'肾',liver:'肝',lung:'肺',heart:'心',upper:'上焦',middle:'中焦',lower:'下焦'};
const Q=[
['即使睡够，我也经常觉得疲倦、没精神。',{qi:2,spleen:.5}],['稍微活动一下，我就容易累、气短，恢复也慢。',{qi:2,lung:.6}],['我说话久了容易没力，懒得多说。',{qi:1.5,lung:.8}],['我稍微活动就容易出汗，或者比别人更容易自汗。',{qi:1.5,lung:.5}],['我面色或唇色容易偏淡，或常有头晕眼花。',{blooddef:2,qi:.5}],['我容易心悸、睡眠浅，脑子累、身体也虚。',{blooddef:1.2,heart:1,qi:.5}],['我比别人明显怕冷，偏爱热饮和温暖环境。',{yang:2,cold:1.5}],['我的手脚经常冷，尤其腰腹、腿脚更明显。',{yang:2,cold:1,kidney:.8,lower:.6}],['天气冷时，我更容易腹泻、胃不舒服或尿频。',{yang:1.5,cold:1,spleen:.8,kidney:.6,lower:.5}],['我经常口干、咽干，尤其晚上更明显。',{yin:2,heat:.5,upper:.5}],['我有时会手足心热、夜间烦热或睡觉觉得燥。',{yin:2,heat:1}],['我容易盗汗，或夜里醒来觉得热、干。',{yin:1.8,heat:.8}],
['我经常觉得身体沉重、脑子昏沉、懒得动。',{damp:2,phlegm:1,spleen:1,middle:.5}],['我饭后很容易犯困、腹胀、消化慢。',{spleen:2,damp:1,qi:1,middle:1}],['我的大便容易黏、冲不干净，或排便不爽。',{damp:1.5,dampheat:1,spleen:.8,middle:.5}],['我容易口黏、痰多、喉咙总像有东西。',{phlegm:2,damp:1,lung:.6,upper:.5}],['我的脸、头皮或身体容易出油，而且会有黏腻感。',{dampheat:1.8,heat:.8,damp:.8}],['我容易口苦、口气重，吃油炸辛辣或喝酒后更明显。',{dampheat:2,heat:1,liver:.5}],['我容易长红痘、发炎，或者同时出现“热、油、黏”。',{dampheat:1.8,heat:1}],['压力一大，我就胸闷、叹气、胃胀或喉咙堵。',{stagnation:2,liver:1,middle:.5}],['我的情绪会明显影响食欲、消化或排便。',{stagnation:1.8,liver:.8,spleen:.5}],['我常觉得事情憋着、堵着，活动或放松后会舒服一点。',{stagnation:1.5,liver:.8}],['我有固定位置反复不舒服，位置比较明确。',{stasis:1.5}],['我容易出现瘀青、肤色暗沉或唇舌颜色偏暗。',{stasis:1.8,blooddef:.3}],
['我经常熬夜，熬夜后口干、烦躁、皮肤或睡眠明显变差。',{yin:1.2,heat:1,liver:.5}],['我经常饮食不规律、暴饮暴食，甜食奶茶或油腻较多。',{damp:1,spleen:1,middle:.8}],['我经常久坐、运动少，身体容易沉重或循环差。',{damp:.8,stasis:.8,qi:.4}],['我容易腰膝酸软、耳鸣、夜尿多或下半身乏力。',{kidney:1.8,yang:.7,yin:.5,lower:1}],['我容易眼干、筋紧，情绪波动后头胀或两胁不舒服。',{liver:1.5,yin:.6,stagnation:.8}],['我容易鼻塞、咳嗽、气短，或者呼吸系统对天气很敏感。',{lung:1.8,qi:.6}],['我容易心烦、心悸、睡不踏实，尤其压力大时。',{heart:1.5,heat:.5,stagnation:.5}],['我经常胃口不好，或者吃一点就胀。',{spleen:1.8,qi:.8,damp:.5,middle:1}],['我喝冰的、吃生冷后，比别人更容易胃不舒服或拉肚子。',{cold:1.5,yang:1,spleen:1,middle:1}],['我明明怕冷或手脚冷，却又经常觉得“上火”。',{yang:1,heat:1,yin:.5,stagnation:.5}],['我容易口渴想喝冷饮，同时大便偏干或尿色偏黄。',{heat:1.7,yin:.5,dampheat:.5}],['我整体更像“虚着虚着又容易出问题”，而不是一直亢奋有力。',{qi:1,yang:.6,yin:.6}],
['夜间的口干、烦热明显强于白天。',{yin:2,heat:.8}],['怕冷、手脚冷是长期底色，而“上火”更像阶段性出现。',{yang:2,cold:1,heat:.5}],['“上火”时会同时伴随口苦、油腻、大便黏或红痘。',{dampheat:2,damp:1,heat:1}],['“上火”常在压力大、熬夜、情绪憋闷后出现。',{stagnation:1.5,heat:1,liver:1}],['吃温补、辛辣后，我更容易口干、长痘或睡不好。',{heat:1.2,yin:.8}],['吃寒凉、冰饮后，我又更容易腹泻、胃胀或四肢更冷。',{yang:1.5,cold:1,spleen:1}],['我经常同时出现“饭后困 + 大便黏 + 身体重”。',{damp:2,spleen:1.5,middle:1}],['我经常同时出现“腰酸/夜尿 + 怕冷 + 下肢乏力”。',{kidney:2,yang:1.5,lower:1}],['我经常同时出现“眼干/唇色淡 + 睡眠差或心悸”。',{blooddef:1.5,liver:1,heart:.8}],['我经常同时出现“胸闷叹气 + 胃胀 + 情绪影响消化”。',{stagnation:2,liver:1,spleen:.8}],['我经常咽喉有痰、胸口闷、头重，但不一定发热。',{phlegm:2,damp:1,lung:.8}],['我的不适常呈“上面觉得热、下面却觉得冷”的感觉。',{heat:1,upper:1,cold:1,lower:1,yang:.5,yin:.5}]
];
let i=0,a=Array(Q.length).fill(null);
function startQuiz(){document.getElementById('intro').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}
function render(){document.getElementById('count').textContent=`${i+1} / ${Q.length}`;document.getElementById('phase').textContent=i<12?'第一层 · 本虚':i<24?'第二层 · 痰湿气血':i<36?'第三层 · 脏腑与生活': '第四层 · 寒热与组合';document.getElementById('prog').style.width=((i)/Q.length*100)+'%';document.getElementById('qtext').textContent=Q[i][0];document.getElementById('opts').innerHTML=L.map((x,j)=>`<button class="option ${a[i]===j?'sel':''}" onclick="choose(${j})">${x}</button>`).join('');document.getElementById('back').disabled=i===0;document.getElementById('next').textContent=i===Q.length-1?'生成身体地图':'下一题'}
function choose(v){a[i]=v;render();setTimeout(()=>{if(i<Q.length-1){i++;render()}else calc()},160)}
function prev(){if(i>0){i--;render()}}
function next(){if(a[i]===null){alert('请先选择一个选项。');return}if(i<Q.length-1){i++;render()}else calc()}
function calc(){const s={};Object.keys(N).forEach(k=>s[k]=0);Q.forEach((q,idx)=>Object.entries(q[1]).forEach(([k,w])=>s[k]=(s[k]||0)+a[idx]*w));const sort=keys=>keys.map(k=>[k,s[k]||0]).sort((x,y)=>y[1]-x[1]);const roots=sort(['qi','blooddef','yin','yang']);const branches=sort(['damp','phlegm','dampheat','stagnation','stasis']);const organs=sort(['spleen','kidney','liver','lung','heart']);const zones=sort(['upper','middle','lower']);const r1=roots[0][0],r2=roots[1][0],b1=branches[0][0],o1=organs[0][0];const cold=s.cold||0,heat=s.heat||0;const high=(arr)=>arr[0][1];const p=(v,m)=>Math.min(100,Math.round(v/Math.max(m,1)*100));const pattern=`${N[r1]}为主${roots[1][1]>roots[0][1]*.72?`，兼${N[r2]}`:''} · ${N[b1]}倾向 · ${N[o1]}较突出`;
const explain={qi:{why:'传统辨证里，气虚常对应“推动、固摄、恢复能力不足”的一组表现。长期睡眠不足、进食不足、过劳、反复生病都可能让这组表现更明显。',eat:'饮食重点不是“猛补”，而是规律三餐、足够能量和蛋白质，避免长期节食。山药、莲子、白扁豆等常见于传统食养语境。',formula:'经典方剂地图中会讨论四君子汤、参苓白术散等益气健脾思路；若同时痰湿明显，传统上又会转向六君子汤一类思路。'},blooddef:{why:'血虚在中医语境里常把面色淡、头晕、心悸、睡眠浅、眼干等放在一起理解，但这些表现也可能来自贫血、营养不足等现代医学原因。',eat:'优先保证正常饮食、铁和蛋白质来源；若长期头晕、心悸、经量异常，应先排除贫血等医学原因。',formula:'传统方剂地图会讨论四物汤、归脾汤等，但是否适合要看是否兼气虚、脾虚、瘀滞或出血倾向。'},yin:{why:'阴虚强调“滋润和制约相对不足”，所以常见干、夜间热、盗汗、烦热等。熬夜和长期高压可让这类表现更明显。',eat:'避免长期熬夜、过度辛辣酒精；饮食上保持足够水分和正常营养，而不是单靠“寒凉降火”。',formula:'传统上常讨论六味地黄丸；若热象突出会涉及知柏地黄丸等思路，但“口干上火”本身不足以判断。'},yang:{why:'阳虚强调“温煦和推动不足”，所以怕冷、手脚冷、腹泻、夜尿等更有权重。如果你同时有热象，系统会把它理解成“底色与阶段性表现可能不同”。',eat:'避免长期大量冰饮、生冷和过度节食，保证能量摄入、规律运动与保暖。',formula:'传统上会讨论理中丸、金匮肾气丸等温中/温阳思路，但阳虚落在脾还是肾、是否夹热，都会改变辨证方向。'},damp:{why:'湿的核心不是“身体里真的有水汽”，而是传统中医用来概括沉重、黏滞、困倦、腹胀、大便黏等一组表现。',eat:'减少长期高糖、高脂、酒精和暴饮暴食，规律活动。薏苡仁、赤小豆、冬瓜等常见于传统食养，但不是治疗替代品。',formula:'湿兼脾虚时，经典思路会讨论参苓白术散；如果痰更明显，可能涉及二陈汤体系。'},phlegm:{why:'“痰”在中医里不只指咳出来的痰，也用来描述口黏、喉中异物感、胸闷、头重等组合。',eat:'减少长期高糖高脂、宵夜与过饱，增加规律活动；观察乳制品、甜食或油腻是否是个人触发因素。',formula:'二陈汤是经典化痰基础方之一；兼寒、兼热、兼气虚时，传统处理路径并不相同。'},dampheat:{why:'湿热强调“黏滞 + 热象”同时出现，比如油、口苦、尿黄、大便黏、红痘等，而不是单纯“上火”。',eat:'减少酒精、重油、高糖、过度辛辣，优先规律睡眠与饮食。',formula:'传统上会按部位讨论清利湿热，但上焦、中焦、下焦湿热用方并不相同，不能用一个“祛湿方”覆盖。'},stagnation:{why:'气滞常与压力、情绪、胸闷、叹气、胃胀等一起出现。它的特点是状态会随情绪和活动明显变化。',eat:'与其找某个“神奇食物”，更重要的是睡眠、运动、规律进食和压力管理。',formula:'传统方剂地图会讨论逍遥散、四逆散、柴胡疏肝散等疏肝理气思路，但要区分是否兼虚、兼热、兼痰。'},stasis:{why:'血瘀在传统语境中强调固定、刺痛、颜色偏暗等表现，但反复不明原因瘀青或固定疼痛也需要现代医学评估。',eat:'重点是减少久坐、保持活动；不建议用“活血食物/药物”替代对持续疼痛或瘀青的检查。',formula:'经典中会讨论桃红四物汤、血府逐瘀汤等活血化瘀思路；孕期、经量大、抗凝药使用者尤其不能自行服用活血类中药。'}};
let why=[];why.push(explain[r1].why);if(branches[0][1]>0)why.push(explain[b1].why);if(cold>5&&heat>5)why.push('你的寒象和热象都不低，所以结果不会简单写成“寒体质”或“热体质”。更值得看的是：哪一组是长期底色，哪一组在熬夜、压力、饮食后阶段性出现。');else why.push(heat>cold?'目前热象比寒象更突出，但仍需区分实热、湿热、阴虚热或郁热。':'目前寒象比热象更突出，但仍要结合气虚、阳虚和消化表现判断。');
const block=(arr)=>arr.map(([k,v])=>`<div style="margin:12px 0"><b>${N[k]}</b> · ${p(v,high(arr))}%<div class="bar"><div class="fill" style="width:${p(v,high(arr))}%"></div></div></div>`).join('');const foods=[explain[r1],explain[b1]].filter(Boolean);document.getElementById('quiz').classList.add('hidden');const R=document.getElementById('result');R.classList.remove('hidden');R.innerHTML=`<div class="card"><span class="pill">你的身体地图</span><h1>${pattern}</h1><p class="muted">这不是诊断，也不是“九选一”。以下是你回答里最突出的传统中医模式。</p></div><div class="card"><h2>1. 你的“本”：整体虚在哪里</h2>${block(roots)}</div><div class="card"><h2>2. 你的“标”：现在又叠加了什么</h2>${block(branches)}</div><div class="card"><h2>3. 为什么会这样</h2>${why.map(x=>`<div class="callout">${x}</div>`).join('')}</div><div class="card"><h2>4. 寒热关系</h2><div class="grid"><div class="mini"><b>寒象</b><div class="score">${Math.round(cold)}</div></div><div class="mini"><b>热象</b><div class="score">${Math.round(heat)}</div></div></div><p class="muted">有热象 ≠ 一定是“实火”；有怕冷 ≠ 一定只有阳虚。传统辨证会继续区分阴虚火旺、湿热、郁热、虚寒夹热等路径。</p></div><div class="card"><h2>5. 主要脏腑 / 三焦方向</h2><div class="grid">${organs.map(([k,v])=>`<div class="mini"><b>${N[k]}</b><p class="muted">相对分数 ${Math.round(v)}</p></div>`).join('')}</div><div class="section">${zones.map(([k,v])=>`<span class="pill">${N[k]} ${Math.round(v)}</span>`).join('')}</div></div><div class="card"><h2>6. 怎么吃、怎么调整</h2>${foods.map(x=>`<div class="mini" style="margin:10px 0"><p class="muted">${x.eat}</p></div>`).join('')}<div class="warn">如果长期乏力、明显怕冷、持续口渴、体重变化、月经异常、心悸、持续腹泻/便秘等影响生活，应同时做正规的医学评估。</div></div><div class="card"><h2>7. 经典方剂辨证地图</h2>${foods.map(x=>`<div class="callout">${x.formula}</div>`).join('')}<p class="muted">重点是理解“为什么会想到某类方”，而不是直接照方服用。中药可能有药物相互作用、孕期禁忌、肝肾风险和误辨证风险。</p></div><button class="btn secondary restart" onclick="location.reload()">重新测试</button>`;window.scrollTo({top:0,behavior:'smooth'})}
</script>
</body></html>
