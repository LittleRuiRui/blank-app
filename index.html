<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCM 体质测试 Beta</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f1e8;color:#2e342d}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fffdf8;border:1px solid #ded6c7;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 8px 30px rgba(50,45,35,.06)}h1{font-size:34px;margin:8px 0}h2{font-size:22px}.muted{color:#6f756c;line-height:1.6}.q{font-size:18px;font-weight:650;margin-bottom:14px}.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.opt{border:1px solid #d7d1c4;border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px;background:#fff}.opt.sel{background:#4b5f48;color:#fff;border-color:#4b5f48}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:#4b5f48;color:white;font-size:16px;font-weight:700;cursor:pointer}.bar{height:10px;background:#ebe6dc;border-radius:99px;overflow:hidden}.fill{height:100%;background:#71816d}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#ece7dc;margin:4px 4px 0 0;font-size:13px}.hidden{display:none}.warn{font-size:13px;color:#786b56;background:#f6efe1;border-radius:12px;padding:12px;line-height:1.5}@media(max-width:560px){.opts{grid-template-columns:1fr}.opt{text-align:left;padding:12px}.wrap{padding:16px}h1{font-size:29px}}</style></head><body><div class="wrap"><div class="card"><div class="pill">TCM Beta</div><h1>看看你最近更像哪种体质</h1><p class="muted">这不是诊断。它把传统中医体质概念翻译成日常可观察的问题，并给你一个“倾向”结果。</p><div class="warn">结果仅作健康教育与自我观察。持续、明显或影响生活的症状应咨询合格医生或注册中医师；不要仅凭测试自行服用中药方剂。</div></div><div id="quiz"></div><button class="btn" onclick="calc()">查看我的体质倾向</button><div id="result" class="hidden"></div></div><script>const types={qi:{n:'气虚质',desc:'偏容易疲倦、气短、恢复慢。',eat:'规律进食、保证蛋白质和总能量；避免长期节食和过度疲劳。',formula:'经典思路常会提到四君子汤、参苓白术散等，但是否适合要结合寒热、消化、舌脉等辨证。'},yang:{n:'阳虚质',desc:'偏怕冷、手脚冷、喜温热。',eat:'避免长期大量冰冷饮食，保持规律活动和保暖。',formula:'传统上会讨论温阳法，但不能仅凭“怕冷”自行使用温补方。'},yin:{n:'阴虚质',desc:'偏干、偏热，可能口咽干、夜间更明显。',eat:'保证饮水和睡眠，减少过量辛辣、酒精及长期熬夜。',formula:'经典教材常提六味地黄丸等滋阴思路，但“上火”并不等于阴虚。'},phlegm:{n:'痰湿质',desc:'偏重、黏、困，常伴口黏、痰多或饭后困。',eat:'减少高糖高脂和暴饮暴食；规律活动。薏苡仁、山药、白扁豆等常见于传统食疗语境。',formula:'二陈汤是经典化痰祛湿基础方之一；痰湿兼寒、兼热、兼气虚时处理方向并不相同。'},dampheat:{n:'湿热质',desc:'偏油、黏、热，可能口苦、油脂旺、吃重口后更不舒服。',eat:'减少酒精、重油、高糖和过度辛辣；保持规律睡眠。',formula:'传统辨证会强调清利湿热，但不同部位的“湿热”用方差异很大。'},blood:{n:'血瘀质',desc:'偏固定不适、暗沉或容易出现瘀滞样表现。',eat:'避免长期久坐，保持适度活动；若出现不明原因反复瘀青应先做医学评估。',formula:'传统会有活血化瘀思路；孕期、经量大或正在用抗凝药时尤其不能自行用活血类中药。'},stagnation:{n:'气郁质',desc:'压力和情绪容易反映在胸口、喉咙或消化上。',eat:'规律作息、运动和减压往往比“吃什么”更重要。',formula:'逍遥散、四逆散等常用于解释疏肝理气的传统思路，但需要辨别虚实和兼证。'},allergy:{n:'特禀质',desc:'对环境、季节或某些物质反应比较明显。',eat:'重点是识别明确诱因，不建议用“排湿、排毒”代替正规的过敏管理。',formula:'中医也有益气固表等思路，但过敏性疾病首先需要明确诱因与严重程度。'}};const qs=[['即使睡眠时间还可以，我也经常觉得疲倦、没精神。',{qi:2,phlegm:1}],['稍微活动一下，我就比别人更容易累或气短。',{qi:2}],['我比身边的人明显更怕冷。',{yang:2,qi:.5}],['我的手脚经常发冷。',{yang:2}],['我经常口干、咽干，尤其晚上明显。',{yin:2}],['我有时觉得身体内部发热，但并不一定发烧。',{yin:2,dampheat:.5}],['我经常觉得身体沉重、懒得动。',{phlegm:2,qi:1}],['我经常觉得嘴里黏黏的，或痰比较多。',{phlegm:2,dampheat:1}],['吃完油腻或甜的东西后，我特别困重。',{phlegm:2}],['我的脸或头皮比较容易油。',{dampheat:2}],['我比较容易出现口苦、口中异味或黏腻感。',{dampheat:2,phlegm:1}],['吃辛辣、油炸或喝酒后，我特别容易不舒服。',{dampheat:2}],['我比较容易出现不明原因的瘀青或肤色暗沉。',{blood:2}],['我有一些位置会反复出现相对固定的不舒服。',{blood:2}],['压力大时，我特别容易觉得胸口、喉咙或胃“堵着”。',{stagnation:2}],['我经常不自觉叹气。',{stagnation:2}],['我的消化状态很容易受情绪影响。',{stagnation:2,qi:.5}],['换季或环境变化时，我鼻、眼或皮肤很容易有反应。',{allergy:2}],['我有比较明确的过敏史或反复敏感表现。',{allergy:2}],['我饭后经常明显犯困。',{phlegm:1.5,qi:1}],['我的大便有时比较黏滞、冲不干净。',{phlegm:1,dampheat:1.5}],['我容易腹胀，尤其吃多以后。',{qi:1,phlegm:1,stagnation:.5}],['我长期熬夜后特别容易出现口干、烦热或状态变差。',{yin:1.5,dampheat:1}],['我久坐、压力大时，身体不适会明显加重。',{stagnation:1,blood:1}]];let ans=Array(qs.length).fill(null);const labels=['从不','偶尔','有时','经常','几乎总是'];const quiz=document.getElementById('quiz');qs.forEach((q,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="q">${i+1}. ${q[0]}</div><div class="opts">${labels.map((x,j)=>`<div class="opt" onclick="pick(${i},${j},this)">${x}</div>`).join('')}</div>`;quiz.appendChild(d)});function pick(i,v,el){ans[i]=v;el.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}function calc(){if(ans.some(x=>x===null)){alert('还有题目没有回答完。');return}let s={};Object.keys(types).forEach(k=>s[k]=0);qs.forEach((q,i)=>{Object.entries(q[1]).forEach(([k,w])=>s[k]+=ans[i]*w)});let arr=Object.entries(s).sort((a,b)=>b[1]-a[1]);let max=Math.max(...arr.map(x=>x[1]),1);let top=arr.slice(0,3);let r=document.getElementById('result');r.className='';r.innerHTML=`<div class="card"><div class="pill">你的结果</div><h2>主要倾向：${types[top[0][0]].n}</h2><p class="muted">${types[top[0][0]].desc}</p>${top.map(([k,v])=>`<p><b>${types[k].n}</b> · ${Math.round(v/max*100)}%</p><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div>`).join('')}</div><div class="card"><h2>你现在可以先注意什么</h2><p class="muted">${types[top[0][0]].eat}</p></div><div class="card"><h2>经典方剂怎么理解</h2><p class="muted">${types[top[0][0]].formula}</p><div class="warn">这里展示的是传统辨证思路，不是处方建议。中药存在药物相互作用、孕期风险、肝肾风险和误辨证风险。</div></div><div class="card"><h2>关于“中焦”</h2><p class="muted">在传统中医框架里，“中焦”大致围绕脾胃的受纳、消化、运化来理解。它不是现代解剖学里的一个独立器官。以后可以把结果进一步拆成“中焦偏弱 / 痰湿偏重 / 湿热偏重 / 情志影响消化”等路径。</p></div>`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
