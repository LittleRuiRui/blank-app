<script>

const core=[
['即使睡够，我也经常觉得疲倦、没精神。',{qi:2,spleen:.5}],['稍微活动就容易累、气短，恢复也慢。',{qi:2,lung:.5}],['我说话有时懒得多说，声音容易没力。',{qi:1.5,lung:1}],['我容易自汗，尤其稍微活动就出汗。',{qi:1.5,lung:.5}],['我面色容易偏淡、唇色偏淡，或者容易头晕。',{blooddef:2,qi:.5}],['我容易心悸、睡眠浅，脑子累但身体也虚。',{blooddef:1.2,heart:1,qi:.5}],['我比别人明显怕冷，喜欢热饮和温暖环境。',{yang:2,cold:1.5}],['我的手脚经常冷，尤其下半身或腰腹。',{yang:2,cold:1,kidney:.8,lower:.5}],['天气冷时，我的消化、腹泻或尿频会更明显。',{yang:1.5,cold:1,spleen:.8,kidney:.8,lower:.5}],['我经常口干、咽干，晚上更明显。',{yin:2,heat:.5,upper:.5}],['我有时会手足心热、夜间烦热或睡觉觉得燥。',{yin:2,heat:1}],['我容易盗汗，或夜里醒来觉得热、干。',{yin:1.8,heat:.8}],['我经常觉得身体沉重、脑子昏沉、懒得动。',{damp:2,phlegm:1,spleen:1,middle:.5}],['我饭后很容易犯困、腹胀、消化慢。',{spleen:2,damp:1,qi:1,middle:1}],['我的大便容易黏、冲不干净，或排便不爽。',{damp:1.5,dampheat:1,spleen:.8,middle:.5}],['我容易口黏、痰多、喉咙总像有东西。',{phlegm:2,damp:1,lung:.6,upper:.5}],['我的脸、头皮或身体容易出油，同时有黏腻感。',{dampheat:1.8,heat:.8,damp:.8}],['我容易口苦、口气重，吃油炸辛辣或喝酒后更明显。',{dampheat:2,heat:1,liver:.5}],['我容易长红痘、发炎，或者出现“热、油、黏”同时存在的状态。',{dampheat:1.8,heat:1}],['压力一大，我就胸闷、叹气、胃胀或喉咙堵。',{stagnation:2,liver:1,middle:.5}],['我的情绪会明显影响食欲、消化或排便。',{stagnation:1.8,liver:.8,spleen:.5}],['我经常觉得事情憋着、堵着，活动或放松后会舒服一点。',{stagnation:1.5,liver:.8}],['我有固定位置反复不舒服，按压或劳累时更明显。',{stasis:1.5}],['我容易出现瘀青、肤色暗沉、唇舌色偏暗。',{stasis:1.8,blooddef:.3}],['我经常熬夜，熬夜后口干、烦躁、皮肤或睡眠明显变差。',{yin:1.2,heat:1,liver:.5}],['我经常饮食不规律、暴饮暴食、甜食奶茶或油腻较多。',{damp:1,spleen:1,middle:.8}],['我经常久坐、运动少，身体容易沉重或循环差。',{damp:.8,stasis:.8,qi:.4}],['我容易腰膝酸软、耳鸣、夜尿多或感觉下半身乏力。',{kidney:1.8,yang:.7,yin:.5,lower:1}],['我容易眼干、筋紧、情绪波动后头胀或两胁不舒服。',{liver:1.5,yin:.6,stagnation:.8}],['我容易鼻塞、咳嗽、气短，或者呼吸系统对天气很敏感。',{lung:1.8,qi:.6}],['我容易心烦、心悸、睡不踏实，尤其压力大时。',{heart:1.5,heat:.5,stagnation:.5}],['我经常胃口不好，或者吃一点就胀。',{spleen:1.8,qi:.8,damp:.5,middle:1}],['我喝冰的、吃生冷后，比别人更容易胃不舒服或拉肚子。',{cold:1.5,yang:1,spleen:1,middle:1}],['我明明怕冷或手脚冷，但又经常觉得“上火”。',{yang:1,heat:1,yin:.5,stagnation:.5}],['我容易口渴想喝冷饮，同时大便偏干或尿色偏黄。',{heat:1.7,yin:.5,dampheat:.5}],['我总体感觉不是“太亢奋”，而是“虚着虚着又容易出问题”。',{qi:1,yang:.6,yin:.6}]
];
const follow=[
['夜间的口干、烦热是否明显强于白天？',{yin:2,heat:.8}],['怕冷、手脚冷是否是长期底色，而“上火”更像阶段性出现？',{yang:2,cold:1,heat:.5}],['“上火”时是否同时伴随口苦、油腻、黏、大便黏或痘痘红肿？',{dampheat:2,damp:1,heat:1}],['“上火”是否常在压力大、熬夜、情绪憋闷后出现？',{stagnation:1.5,heat:1,liver:1}],['吃温补、辛辣后是否更容易口干、长痘或睡不好？',{heat:1.2,yin:.8}],['吃寒凉、冰饮后是否又容易腹泻、胃胀或四肢更冷？',{yang:1.5,cold:1,spleen:1}],['你是否同时有“饭后困 + 大便黏 + 身体重”？',{damp:2,spleen:1.5,middle:1}],['你是否同时有“腰酸/夜尿 + 怕冷 + 下肢乏力”？',{kidney:2,yang:1.5,lower:1}],['你是否同时有“眼干/经期量少/唇淡 + 睡眠差”？',{blooddef:1.5,liver:1,heart:.8}],['你是否同时有“胸闷叹气 + 胃胀 + 情绪影响消化”？',{stagnation:2,liver:1,spleen:.8}],['你是否经常咽喉有痰、胸口闷、头重但不一定发热？',{phlegm:2,damp:1,lung:.8}],['你的不适是否常呈“上面热、下面冷”的感觉？',{heat:1,upper:1,cold:1,lower:1,yang:.5,yin:.5}]
];
let ans=Array(core.length).fill(null), fans=Array(follow.length).fill(null);
function render(list,target){const el=document.getElementById(target);el.innerHTML='';list.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="q">${i+1}. ${q[0]}</div><div class="opts">${labels.map((x,j)=>`<div class="opt" onclick="pick('${target}',${i},${j},this)">${x}</div>`).join('')}</div>`;el.appendChild(d)})}
function pick(target,i,v,el){(target==='quiz'?ans:fans)[i]=v;el.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');updateProg()}
function updateProg(){const done=ans.filter(x=>x!==null).length+fans.filter(x=>x!==null).length;document.getElementById('prog').style.width=(done/(core.length+follow.length)*100)+'%'}
render(core,'quiz');render(follow,'followQuiz');
function goFollow(){if(ans.some(x=>x===null)){alert('还有基础问题没有回答完。');return}document.getElementById('followWrap').classList.remove('hidden');document.getElementById('mainBtn').classList.add('hidden');document.getElementById('resultBtn').classList.remove('hidden');document.getElementById('followWrap').scrollIntoView({behavior:'smooth'})}
const explain={
qi:{title:'气虚',eat:'优先规律吃饭、足够蛋白质和总能量，避免长期节食、过劳与睡眠不足。传统食疗里常见山药、莲子、白扁豆、粳米等。',formula:'传统辨证常会讨论四君子汤、参苓白术散；若兼痰湿，还可能进入六君子汤一类思路。'},
blooddef:{title:'血虚',eat:'保证铁、蛋白质、叶酸和B12等营养来源；若经量大或长期乏力，现代医学上也应排除贫血。',formula:'传统常见四物汤类思路，但是否适合要结合月经、消化、寒热和是否有瘀滞。'},
yin:{title:'阴虚',eat:'重视睡眠和水分，减少长期熬夜、酒精和过度辛辣。传统食疗语境里常见百合、银耳、梨、芝麻等。',formula:'传统上常讨论六味地黄丸、知柏地黄丸等滋阴思路，但后者偏向阴虚火旺，并不适合所有“上火”。'},
yang:{title:'阳虚',eat:'避免长期大量生冷和冰饮，规律活动、保暖。并不意味着应该盲目大补、天天吃辛辣温热。',formula:'传统会讨论理中丸、金匮肾气丸等温中或温补肾阳方向，但脾阳虚与肾阳虚不是一回事，也不能仅凭怕冷选方。'},
damp:{title:'湿',eat:'先减少暴饮暴食、高糖高油和长期久坐；规律吃饭与运动往往比“祛湿茶”更关键。传统食疗常见薏苡仁、赤小豆、冬瓜、山药。',formula:'若偏脾虚夹湿，常讨论参苓白术散；若痰更明显，则会进入二陈汤体系。'},
phlegm:{title:'痰',eat:'减少高糖高脂、夜宵和暴饮暴食；观察乳制品或高油饮食是否让你主观上更黏腻，但不必把所有乳制品都一概禁掉。',formula:'二陈汤是经典化痰基础方；若痰热、寒痰、痰湿兼气虚，方向都会不同。'},
dampheat:{title:'湿热',eat:'减少酒精、重油、过量辛辣和高糖；不要一边“清热”一边继续熬夜、喝酒和重口饮食。',formula:'传统会按部位讨论清利湿热的不同方路，例如肝胆、脾胃、下焦各不相同，不能只凭“湿热”两个字自动套方。'},
stagnation:{title:'气滞 / 肝郁',eat:'规律运动、睡眠和压力处理非常关键。饮食上避免压力大时暴饮暴食。',formula:'传统常讨论四逆散、逍遥散、柴胡疏肝散等疏肝理气思路；兼血虚、脾虚、化热时用法会改变。'},
stasis:{title:'血瘀',eat:'保持活动，避免久坐；不明原因反复瘀青或异常出血应先做现代医学评估。',formula:'传统有桃红四物汤、血府逐瘀汤等活血化瘀思路。孕期、经量大、出血倾向或使用抗凝药时尤其不能自行使用活血药。'}
};
function scores(){let s={};Object.keys(D).forEach(k=>s[k]=0);core.forEach((q,i)=>Object.entries(q[1]).forEach(([k,w])=>s[k]+=(ans[i]??0)*w));follow.forEach((q,i)=>Object.entries(q[1]).forEach(([k,w])=>s[k]+=(fans[i]??0)*w));return s}
function pct(v,max){return Math.round((v/max)*100)}
function topKeys(s,keys,n=3){return keys.map(k=>[k,s[k]||0]).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function calc(){
 if(fans.some(x=>x===null)){alert('还有追问题没有回答完。');return}
 const s=scores();const roots=topKeys(s,['qi','blooddef','yin','yang'],4);const branches=topKeys(s,['damp','phlegm','dampheat','stagnation','stasis'],5);const organs=topKeys(s,['spleen','kidney','liver','lung','heart'],3);const zones=topKeys(s,['upper','middle','lower'],3);const cold=s.cold||0,heat=s.heat||0;
 const rootMax=Math.max(...roots.map(x=>x[1]),1),branchMax=Math.max(...branches.map(x=>x[1]),1);const primaryRoot=roots[0][0],primaryBranch=branches[0][1]>4?branches[0][0]:null;let pattern=`以${explain[primaryRoot]?.title||D[primaryRoot]}为底`;if(primaryBranch)pattern+=`，同时夹${explain[primaryBranch]?.title||D[primaryBranch]}`;if(heat>cold*1.2)pattern+='，整体热象更明显';else if(cold>heat*1.2)pattern+='，整体寒象更明显';else if(heat>5&&cold>5)pattern+='，寒热表现并见';
 const reasons=[];if(primaryRoot==='yang'&&heat>6)reasons.push('你同时有阳虚与热象：这并不自动等于“纯热体质”。如果怕冷、手脚冷是长期底色，而热象在熬夜、压力、重口后加重，更像“底子偏虚寒，阶段性又叠加热象”的组合。');if(primaryRoot==='yin'&&cold>6)reasons.push('你同时有阴虚与寒象，需要进一步区分是否存在气阳不足、末梢怕冷，不能因为口干夜热就只按“阴虚火旺”理解。');if((s.spleen||0)>8&&(s.damp||0)>7)reasons.push('中焦线索较集中：饭后困、腹胀、黏滞与饮食不规律把“脾胃运化不足 → 湿停”的路径串了起来。');if((s.stagnation||0)>7&&(s.heat||0)>6)reasons.push('压力与热象一起升高，传统辨证会考虑“郁而化热”的可能，而不是简单把所有不适都归到阴虚。');if((s.dampheat||0)>7)reasons.push('湿和热是同时出现的：如果油、黏、口苦、红痘、大便黏等聚在一起，比单纯“上火”更接近湿热模式。');if(!reasons.length)reasons.push('你的结果更像多因素叠加，而不是单一体质。建议把“长期底色”和“最近状态”分开看：长期怕冷/疲倦属于底子，熬夜、压力、重口后的波动属于近期叠加。');
 const topAdvice=[primaryRoot,primaryBranch].filter(Boolean).map(k=>explain[k]).filter(Boolean);const formulaHtml=topAdvice.map(x=>`<div class="mini"><b>${x.title}</b><p class="muted">${x.formula}</p></div>`).join('');const eatHtml=topAdvice.map(x=>`<div class="mini"><b>${x.title}</b><p class="muted">${x.eat}</p></div>`).join('');const scoreBlock=(arr,max)=>arr.map(([k,v])=>`<div style="margin:11px 0"><b>${D[k]||explain[k]?.title}</b> · ${pct(v,max)}<div class="bar"><div class="fill" style="width:${pct(v,max)}%"></div></div></div>`).join('');
